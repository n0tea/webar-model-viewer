<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161D">
  <title>Модели в дополненной реальности</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main id="intro">
    <header>
      <span class="label">ДОПОЛНЕННАЯ РЕАЛЬНОСТЬ</span>
      <h1>Модели в AR</h1>
      <p>Наведите камеру на метку, чтобы разместить 3D-модель и рассмотреть её с разных сторон.</p>
    </header>
    <section class="marker-card" aria-labelledby="marker-title">
      <img width="175" height="175" src="https://raw.githubusercontent.com/AR-js-org/AR.js/3.4.7/data/images/hiro.png" alt="Чёрно-белая метка Hiro">
      <div>
        <h2 id="marker-title">Метка Hiro</h2>
        <p>Распечатайте метку или откройте её на другом экране.</p>
        <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/3.4.7/data/images/hiro.png" target="_blank" rel="noopener">Открыть метку ↗</a>
      </div>
    </section>
    <button id="start" type="button">Открыть камеру</button>
    <p id="intro-status" role="status"></p>
    <noscript>Для запуска камеры включите JavaScript.</noscript>
  </main>

  <aside id="camera-controls" hidden aria-label="Управление камерой">
    <div class="camera-header">
      <div><strong>Просмотр модели</strong><span id="model-caption">Загружаем модель…</span></div>
      <button id="exit" type="button">Закрыть камеру</button>
    </div>
    <p id="camera-status" role="status">Разрешите доступ к камере.</p>
  </aside>

  <template id="ar-scene">
    <a-scene embedded xr-mode-ui="enabled: false" renderer="alpha: true; antialias: auto"
      gltf-model="dracoDecoderPath: ./vendor/draco/"
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; detectionMode: mono; maxDetectionRate: 30; debugUIEnabled: false">
      <a-entity light="type: ambient; intensity: 1.1"></a-entity>
      <a-entity light="type: directional; intensity: 2" position="1 3 2"></a-entity>
      <a-marker preset="hiro" emitevents="true" smooth="false" smooth-marker-pose>
        <a-entity id="model-frame" visible="false">
          <a-entity id="locomotive-model"></a-entity>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </template>
</body>
</html>
